name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.25'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Test source and copied modules
        run: uv run --locked pytest -q
      - name: Build from the locked environment
        run: uv build --no-build-isolation
      - name: Verify isolated installation and installed types
        run: uv run --locked python tests/check_distribution.py

  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.25'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check fetch.py setup.py tests
      - run: uv run --locked ruff format --check fetch.py setup.py tests
      - run: uv run --locked mypy fetch.py tests/check_types.py tests/check_installed_types.py
      - run: uv run --locked pyright fetch.py tests/check_types.py tests/check_installed_types.py
